# Docs: https://github.com/burmilla/os-services/blob/v3.0.x/images/20-fleetclient/README.md
fleet-client:
  image: ${REGISTRY_DOMAIN}/burmilla/os-fleetclient:v3.0.0
  environment:
  - FLEET_*
  labels:
    io.rancher.os.scope: system
    io.rancher.os.after: docker
  privileged: true
  restart: always
  pid: host
  ipc: host
  net: host
  uts: host
  volumes_from:
  - command-volumes
  - system-volumes
