# Docs: https://github.com/burmilla/os-services/blob/v3.0.x/images/20-otelcollector/README.md
otel-collector:
  image: ${REGISTRY_DOMAIN}/burmilla/os-otelcollector:v0.163.2-1
  environment:
  - OTELCOL_*
  labels:
    io.rancher.os.scope: system
    io.rancher.os.after: docker
  privileged: true
  restart: always
  pid: host
  net: host
  uts: host
  volumes_from:
  - system-volumes
  volumes:
  - /:/hostfs:ro
  - /var/lib/docker/containers:/var/lib/docker/containers:ro
  - /var/lib/system-docker/containers:/var/lib/system-docker/containers:ro
  - /var/lib/rancher/otel-collector:/var/lib/otelcol
