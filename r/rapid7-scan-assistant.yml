# Docs: https://github.com/burmilla/os-services/blob/v3.0.x/images/20-scanassistant/README.md
rapid7-scan-assistant:
  image: ${REGISTRY_DOMAIN}/burmilla/os-scanassistant:v1.0.0
  environment:
  - SCAN_ASSISTANT_*
  labels:
    io.rancher.os.scope: system
    io.rancher.os.after: console
  privileged: true
  restart: always
  pid: host
  ipc: host
  net: host
  uts: host
  volumes_from:
  - command-volumes
  - system-volumes
